name: Validar ferramentas de pesquisa

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Sintaxe Python
        run: python -m compileall -q tools tests
      - name: Testes sintéticos (sem arquivos do jogo)
        run: python -m unittest discover -s tests -v
